name: hygiene
on:
  push:
  pull_request:
jobs:
  h1-h10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: H1–H10 hygiene acceptance
        run: ./scripts/test-hygiene.sh
      - name: P2 unit tests (plaintext + pin boundary)
        run: ./tests/test-plaintext.sh && ./tests/test-pin.sh
      - name: Wave 1 (named-creds, trace/logs, MCP)
        run: |
          chmod +x tests/test-named-creds.sh tests/test-trace.sh tests/test-mcp.sh
          ./tests/test-named-creds.sh
          ./tests/test-trace.sh
          python3 ./tests/test-mcp.sh
      - name: Wave 2 (FLS, offenders, desk, clipboard)
        run: |
          chmod +x tests/test-wave2.sh
          ./tests/test-wave2.sh
      - name: UX pass (bar, incident, watch, help)
        run: |
          chmod +x tests/test-ux-pass.sh bin/bluechip-scratchpad
          ./tests/test-ux-pass.sh
